{{- if .Values.presidio.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
  namespace: {{ .Release.Namespace }}
  labels:
    app: presidio-analyzer
    {{- include "governance.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presidio-analyzer
  template:
    metadata:
      labels:
        app: presidio-analyzer
    spec:
      containers:
        - name: analyzer
          image: {{ .Values.presidio.analyzer.image }}
          ports:
            - containerPort: {{ .Values.presidio.analyzer.port }}
          env:
            - name: LOG_LEVEL
              value: WARNING
          resources:
            {{- toYaml .Values.presidio.analyzer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
  namespace: {{ .Release.Namespace }}
  labels:
    app: presidio-analyzer
spec:
  selector:
    app: presidio-analyzer
  ports:
    - port: {{ .Values.presidio.analyzer.port }}
      targetPort: {{ .Values.presidio.analyzer.port }}
{{- end }}
